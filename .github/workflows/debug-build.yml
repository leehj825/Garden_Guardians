# Builds a debug Android APK on every push to a non-main branch and uploads it
# as a downloadable workflow artifact for manual testing.
name: Android Debug Build

on:
  push:
    branches-ignore:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-debug-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        env:
          # Install into a user-writable folder so 'dotnet workload install'
          # doesn't need sudo to write into the runner's system .NET.
          DOTNET_INSTALL_DIR: ${{ runner.temp }}/dotnet
        with:
          dotnet-version: 8.0.x

      - name: Install Android workload
        run: dotnet workload install android

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # Raylib-cs has no Android native library, so compile raylib 6.0 (plus
      # the NativeActivity glue and our main() bridge) with the runner's NDK.
      - name: Build raylib for Android
        run: bash Platforms/Android/build-raylib.sh

      # Debug builds normally leave assemblies out of the APK and stream them
      # from the IDE ("fast deployment"). Embed them so the APK runs when
      # sideloaded on its own.
      - name: Publish debug APK
        run: >
          dotnet publish GardenGuardians.csproj
          -f net8.0-android
          -c Debug
          -p:EmbedAssembliesIntoApk=true

      # Debug APKs are signed automatically with the SDK's throwaway debug key
      # (Android refuses to install a truly unsigned APK). No release keystore
      # is involved.
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: garden-guardians-debug-apk
          path: bin/Debug/net8.0-android/publish/*-Signed.apk
          if-no-files-found: error
