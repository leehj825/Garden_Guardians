# Builds a release Android APK signed with the project's upload keystore on
# every push to main, and uploads it as a workflow artifact.
#
# Required repository secrets:
#   KEYSTORE_BASE64    - the .keystore file, base64-encoded (base64 -w0 release.keystore)
#   KEYSTORE_PASSWORD  - keystore (store) password
#   KEY_ALIAS          - alias of the signing key inside the keystore
#   KEY_PASSWORD       - password of that key
name: Android Release Build

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-release-apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        env:
          # Install into a user-writable folder so 'dotnet workload install'
          # doesn't need sudo to write into the runner's system .NET.
          DOTNET_INSTALL_DIR: ${{ runner.temp }}/dotnet
        with:
          dotnet-version: 8.0.x

      - name: Install Android workload
        run: dotnet workload install android

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      # Raylib-cs has no Android native library, so compile raylib 6.0 (plus
      # the NativeActivity glue and our main() bridge) with the runner's NDK.
      - name: Build raylib for Android
        run: bash Platforms/Android/build-raylib.sh

      - name: Decode keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::KEYSTORE_BASE64 secret is not set."
            exit 1
          fi
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > release.keystore

      # Passwords are passed with the 'env:' prefix that .NET for Android
      # supports, so they are read from environment variables and never
      # appear on the command line or in the build log.
      - name: Publish signed release APK
        env:
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: >
          dotnet publish GardenGuardians.csproj
          -f net8.0-android
          -c Release
          -p:AndroidKeyStore=true
          -p:AndroidSigningKeyStore=release.keystore
          -p:AndroidSigningKeyAlias="$KEY_ALIAS"
          -p:AndroidSigningKeyPass=env:KEY_PASSWORD
          -p:AndroidSigningStorePass=env:KEYSTORE_PASSWORD

      - name: Upload signed release APK
        uses: actions/upload-artifact@v4
        with:
          name: garden-guardians-release-apk
          path: bin/Release/net8.0-android/publish/*-Signed.apk
          if-no-files-found: error

      - name: Remove keystore
        if: always()
        run: rm -f release.keystore
